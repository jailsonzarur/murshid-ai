startsecs = 5
stopwaitsecs = 110
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:worker_summary]
command = celery -A src.core.celery.celery_app worker
