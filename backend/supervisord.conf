[supervisord]
nodaemon = true
loglevel = info
pidfile = /tmp/supervisord.pid
logfile = /dev/null
logfile_maxbytes = 0

[unix_http_server]
file = /tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///tmp/supervisor.sock

[program:worker_media]
command = celery -A src.core.celery.celery_app worker
    --hostname media@%%h
    --queues celery,lectures,audios
    --pool prefork
    --concurrency %(ENV_MEDIA_CONCURRENCY)s
    --loglevel %(ENV_CELERY_LOG_LEVEL)s
directory = /app
autostart = true
autorestart = true
startsecs = 5
stopwaitsecs = 110
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:worker_transcribe]
command = celery -A src.core.celery.celery_app worker
    --hostname transcribe@%%h
    --queues chunks
    --pool %(ENV_TRANSCRIBE_POOL)s
